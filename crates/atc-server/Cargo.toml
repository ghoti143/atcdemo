[package]
name = "atc-server"
description = "Real-time server: simulator, conflict detector and the WebSocket."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
atc-core.workspace = true
axum = "0.8.9"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
