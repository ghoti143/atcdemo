[package]
name = "atc-server"
description = "Real-time server: simulator, conflict detector and the WebSocket."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
atc-core.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
flate2 = "1.1.11"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter"] }
webpki-roots = "1"

[dev-dependencies]
futures-util = "0.3.34"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }

# A plain timing program, with no harness: `cargo bench -p atc-server`.
[[bench]]
name = "world"
harness = false

[[bench]]
name = "tick"
harness = false
