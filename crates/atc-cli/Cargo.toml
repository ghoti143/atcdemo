[package]
name = "atc-cli"
description = "Command-line client: watches atc-server's stream without a browser."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# The versions are the ones atc-server already uses, so the lockfile gains
# no new packages.
[dependencies]
atc-core.workspace = true
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "time", "signal"] }
# Built without TLS: the client is for a server on this machine or network.
tokio-tungstenite = "0.29.0"

# The test runs the client against the real hub, in process.
[dev-dependencies]
atc-server = { path = "../atc-server" }
axum = "0.8.9"
