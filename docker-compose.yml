# `docker compose up` starts Postgres, runs the one-shot setup step, then
# starts atc-server. The web app runs on the host with `bun dev`.
#
# `docker compose --profile full up` runs the web app in a container too,
# so one command starts everything: http://localhost:3000.
#
# Needs .env at the repo root: `cp .env.example .env`.

name: atcdemo

x-database-url: &database-url
  # Inside compose the services reach Postgres by its service name, so this
  # replaces the host address that .env carries for the web app.
  DATABASE_URL: postgres://atc:atc@postgres:5432/atc

services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: atc
      POSTGRES_PASSWORD: atc
      POSTGRES_DB: atc
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atc -d atc"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Applies the Drizzle migrations, then exits. Safe to run on every start.
  setup:
    build:
      context: .
      dockerfile: apps/web/setup.Dockerfile
    env_file: .env
    environment: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  atc-server:
    build:
      context: .
      dockerfile: crates/atc-server/Dockerfile
    env_file: .env
    environment:
      <<: *database-url
      # A development aid, taken from the shell as well as from .env, so one
      # run can start late: `ATC_START_SECONDS=14340 docker compose up`.
      ATC_START_SECONDS: ${ATC_START_SECONDS:-}
    ports:
      - "${ATC_SERVER_PORT:-8080}:8080"
    # Lets the server reach the web app on the host for the signing keys.
    # Docker Desktop provides this name; on Linux it has to be mapped.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      setup:
        condition: service_completed_successfully

  # The web app, in the `full` profile only. Its settings come from .env
  # when it starts; none are built into the image.
  web:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment: *database-url
    ports:
      # atc-server fetches the signing keys from the web app through the
      # host (ATC_JWKS_URL, host.docker.internal:3000), as it does when the
      # web app runs on the host, so the port on the host stays 3000.
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  postgres-data:
