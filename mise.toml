# Tool versions for anyone who uses mise (https://mise.jdx.dev): run
# `mise install` once in the repo. Docker is the one tool it does not cover.
#
# All three are also pinned elsewhere, for CI and the Docker images, which
# do not use mise. Keep them in step:
#   bun        "packageManager" in package.json
#   rust       rust-toolchain.toml (channel, components and targets)
#   wasm-pack  WASM_PACK_VERSION in .github/workflows/ci.yml
[tools]
bun = "1.4.5"
rust = { version = "stable", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
"github:wasm-bindgen/wasm-pack" = "0.15.1"
